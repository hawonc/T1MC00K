<!DOCTYPE html>
<!--
  T1MC00K, styled after the Bear Blog look (hugo-bearcub "original" theme).
  The palette, typography, list and code styles below mirror the theme's
  assets/original.css so the app feels right at home next to a Bear Blog.
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1MC00K</title>
  <style>
    /* ---- Bear Blog "original" look ----------------------------------- */
    body {
      font-family: Verdana, sans-serif;
      margin: auto;
      padding: 20px;
      max-width: 720px;
      text-align: left;
      background-color: #1d1f27;
      word-wrap: break-word;
      overflow-wrap: break-word;
      line-height: 1.5;
      color: #c9d1d9;
    }
    h1, h2, h3, h4, h5, h6, strong, b { color: #eee; }
    a { color: #8cc2dd; }
    a:visited { color: #8b6fcb; }
    .title { text-decoration: none; border: 0; }
    .title h1 { font-size: 24px; margin: 19.92px 0 19.92px 0; }
    nav a { margin-right: 10px; }
    input {
      background-color: #252525;
      color: #ddd;
      font-size: 16px;
    }
    content { line-height: 1.6; display: block; }
    table { width: 100%; }
    table, th, td {
      border: 1px solid;
      border-collapse: collapse;
      border-color: #c9d1d9;
      padding: 5px;
    }
    code { padding: 2px 5px; color: #f8f8f2; background-color: #282a36; }
    pre code {
      display: block;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      overflow-x: auto;
      text-wrap: nowrap;
    }
    blockquote {
      border-left: 1px solid #999;
      color: #ccc;
      padding-left: 20px;
      font-style: italic;
    }
    footer { padding: 25px; text-align: center; }
    .helptext { color: #aaa; font-size: small; }
    p.byline { font-style: italic; }
    ul.blog-posts { list-style-type: none; padding: unset; }
    ul.blog-posts li { display: flex; margin-bottom: 10px; }
    ul.blog-posts li span { flex: 0 0 130px; }
    a.blog-tags { line-height: 2; margin-right: 12px; }
    .skip-link {
      position: absolute; top: 5; transform: translateY(-600%);
      transition: transform 0.5s; background-color: #1d1f27; padding: 6px;
    }
    .skip-link:focus { transform: translateY(0%); }

    /* ---- app-specific, in the same spirit ---------------------------- */
    .tools { margin-bottom: 1.2rem; }
    .tools input[type=search] {
      width: 100%; max-width: 26em; padding: 4px 8px; border: 1px solid #444;
    }
    .tools a, .tools a:visited { margin-left: 12px; font-size: small; }
    .snippet { color: #aaa; font-size: small; font-style: italic; margin-left: 130px; }
    .actions { font-size: small; }
    .actions a { margin-left: 12px; }
    ol.steps li { margin-bottom: .6rem; }
    ol.steps blockquote, p.prose blockquote { margin: .4rem 0 .2rem; }
    h4.section { margin: 1.1rem 0 .4rem; }
    p.prose { margin: .4rem 0; }
    blockquote { font-size: .92em; }
    ul.ingredients { list-style-type: none; padding: unset; }
    ul.ingredients li span.amt { color: #aaa; }
    .msg { color: #aaa; font-style: italic; }
    .error { color: #eba613; font-style: italic; }
    .tagrow { margin: .3rem 0 1rem; }
    @media (max-width: 500px) {
      ul.blog-posts li { display: block; }
      .snippet { margin-left: 0; }
    }
  </style>
</head>

<body>
<header>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <a href="/" class="title"><h1>T1MC00K</h1></a>
  <nav>
    <a href="/">Recipes</a>
  </nav>
</header>

<main id="main-content">
<content>
  <div class="tools">
    <input id="q" type="search" placeholder="Search recipes and ingredients…"
           aria-label="Search recipes">
    <!-- TODO: add auth on the server, then re-enable uploads
    <a href="#" id="pick" title="Upload CookLang files">upload .cook ↪</a>
    <input type="file" id="file" accept=".cook" multiple hidden>
    -->
  </div>

  <div id="content"><p class="msg">Loading…</p></div>
</content>
</main>

<footer><small>recipes are stored as CookLang source</small></footer>

<script>
const $ = s => document.querySelector(s);
const content = $('#content');

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

const tagLinks = tags => (tags || []).map(t =>
  `<a class="blog-tags" href="#" data-tag="${esc(t)}">#${esc(t.toLowerCase())}</a>`).join('');

const dateOf = r => (r.created_at || '').slice(0, 10);

function wireTags(el) {
  for (const a of el.querySelectorAll('a[data-tag]'))
    a.onclick = e => { e.preventDefault(); $('#q').value = a.dataset.tag; showList(a.dataset.tag); };
}

let currentView = null; // 'list' | id

async function showList(query) {
  currentView = 'list';
  try {
    const recipes = query
      ? await api('api/search?q=' + encodeURIComponent(query))
      : await api('api/recipes');
    const q = query ? `&mdash; “${esc(query)}”` : '';
    if (!recipes.length) {
      content.innerHTML = `<h3 class="blog-filter">Recipes${q}</h3>` +
        (query ? '<p class="msg">No recipes match.</p>'
               : '<p class="msg">No recipes yet.</p>');
      return;
    }
    content.innerHTML = `<h3 class="blog-filter">Recipes (${recipes.length})${q}</h3>
      <ul class="blog-posts">
        ${recipes.map(r => `
          <li>
            <span><i><time>${dateOf(r)}</time></i></span>
            <a href="#" data-id="${r.id}">${esc(r.title)}</a>
          </li>
          ${r.snippet ? `<li class="snippet">${esc(r.snippet)}</li>` : ''}`).join('')}
      </ul>
      ${query ? '' : `<div>${tagLinks(allTags(recipes))}</div>`}`;
    for (const a of content.querySelectorAll('a[data-id]'))
      a.onclick = e => { e.preventDefault(); showRecipe(a.dataset.id); };
    wireTags(content);
  } catch (e) {
    content.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

function allTags(recipes) {
  return [...new Set(recipes.flatMap(r => r.tags || []))].sort();
}

async function showRecipe(id) {
  currentView = id;
  content.innerHTML = '<p class="msg">Loading…</p>';
  try {
    const r = await api('api/recipes/' + id);
    const ing = r.ingredients.map(i => `
      <li>${esc(i.name)}
        ${i.amount || i.unit ? `<span class="amt">— ${esc([i.amount, i.unit].filter(Boolean).join(' '))}</span>` : ''}
        ${i.note ? `<span class="amt">(${esc(i.note)})</span>` : ''}
        ${i.optional ? '<span class="amt">(optional)</span>' : ''}
      </li>`).join('');
    // legacy databases served steps as plain strings
    const steps = (r.steps || []).map(s => typeof s === 'string' ? { text: s } : s);
    // method: section headers break the list; notes render as blockquotes
    let method = '', ol = false, section = null;
    const openOl = () => { if (!ol) { method += '<ol class="steps">'; ol = true; } };
    const closeOl = () => { if (ol) { method += '</ol>'; ol = false; } };
    for (const s of steps) {
      const notes = (s.notes || []).map(n => `<blockquote>${esc(n)}</blockquote>`).join('');
      if (s.section && s.section !== section) {
        closeOl();
        section = s.section;
        method += `<h4 class="section">${esc(s.section)}</h4>`;
      }
      if (s.text_block) {
        closeOl();
        method += `<p class="prose">${esc(s.text)}${notes}</p>`;
      } else {
        openOl();
        method += `<li>${esc(s.text)}${notes}</li>`;
      }
    }
    closeOl();
    const bits = [];
    if (r.times?.prep) bits.push('prep ' + r.times.prep);
    if (r.times?.cook) bits.push('cook ' + r.times.cook);
    if (r.times?.total) bits.push(r.times.total);
    if (r.servings) bits.push('serves ' + esc(r.servings));
    const prov = r.provenance || '';
    const provHtml = /^https?:\/\//.test(prov)
      ? `from <a href="${esc(prov)}" target="_blank" rel="noopener">${esc(new URL(prov).hostname)}</a>`
      : (prov ? 'from ' + esc(prov) : '');
    if (provHtml) bits.push(provHtml);
    const byline = bits.length ? `<p class="byline">${bits.join(' &middot; ')}</p>` : '';
    content.innerHTML = `
      <p class="actions"><a href="#" id="back">&larr; All recipes</a>
        <a href="#" id="del">delete</a></p>
      <h1>${esc(r.title)}</h1>
      ${byline}
      <div class="tagrow">${tagLinks(r.tags)}</div>
      ${r.ingredients.length ? `<h3>Ingredients</h3><ul class="ingredients">${ing}</ul>` : ''}
      ${steps.length ? `<h3>Method</h3>${method}` : ''}
      <h3>Source <span class="helptext">(.cook)</span></h3>
      <pre><code>${esc(r.source)}</code></pre>`;
    $('#back').onclick = e => { e.preventDefault(); $('#q').value = ''; showList(); };
    $('#del').onclick = async e => {
      e.preventDefault();
      if (!confirm('Delete this recipe?')) return;
      try { await api('api/recipes/' + id, { method: 'DELETE' }); } catch (err) { alert(err.message); return; }
      $('#q').value = ''; showList();
    };
    wireTags(content);
  } catch (e) {
    content.innerHTML = `<p class="error">${esc(e.message)}</p>`;
  }
}

$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') showList(e.target.value.trim());
});

/* Upload UI disabled until the POST /api/recipes route is re-enabled
   with auth — see internal/api/server.go Routes().
$('#pick').onclick = e => { e.preventDefault(); $('#file').click(); };
$('#file').onchange = async () => {
  const files = [...$('#file').files];
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('file', f, f.name);
  try {
    const results = await api('api/recipes', { method: 'POST', body: fd });
    const failed = results.filter(r => r.error);
    if (failed.length)
      alert('Failed:\n' + failed.map(f => `${f.filename}: ${f.error}`).join('\n'));
  } catch (e) {
    alert('Upload failed: ' + e.message);
  }
  $('#file').value = '';
  showList();
};
*/

// keep the list in sync with the search box (back/forward, manual clears)
$('#q').addEventListener('search', () => {
  if (currentView !== 'list') return;
  showList($('#q').value.trim());
});

showList();
</script>
</body>

</html>
